<!DOCTYPE html>
<html lang="tk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Barmak Elipbiýi we Žestler Oýuny</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #e0c3fc 0%, #8ec5fc 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
    }

    /* Шапка со счетом и выбором режима */
    .top-bar {
      width: 100%;
      max-width: 480px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: white;
      padding: 12px 20px;
      border-radius: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.1);
      margin-bottom: 15px;
    }

    .stars-count {
      font-size: 1.3rem;
      font-weight: bold;
      color: #f39c12;
    }

    /* Переключатель режимов */
    .mode-select {
      display: flex;
      gap: 10px;
      margin-bottom: 15px;
    }

    .btn-mode {
      background: #ffffff;
      border: 2px solid #3498db;
      padding: 8px 16px;
      border-radius: 15px;
      font-weight: bold;
      color: #3498db;
      cursor: pointer;
    }

    .btn-mode.active {
      background: #3498db;
      color: white;
    }

    /* Карточка с вопросом */
    .game-card {
      background: white;
      width: 100%;
      max-width: 480px;
      border-radius: 25px;
      padding: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.15);
      text-align: center;
    }

    .task-title {
      font-size: 1.3rem;
      color: #2c3e50;
      margin-bottom: 15px;
      font-weight: bold;
    }

    .gesture-box {
      width: 100%;
      height: 230px;
      background: #f8f9fa;
      border: 3px dashed #a8c0ff;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
      overflow: hidden;
    }

    .gesture-box img {
      max-width: 90%;
      max-height: 90%;
      object-fit: contain;
    }

    /* Кнопки ответов */
    .answers-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .btn-answer {
      background: #f1f2f6;
      border: 3px solid #dfe4ea;
      padding: 15px;
      font-size: 1.2rem;
      font-weight: bold;
      color: #2f3542;
      border-radius: 18px;
      cursor: pointer;
      box-shadow: 0 4px 0 #ced6e0;
      transition: all 0.1s ease;
    }

    .btn-answer:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 #ced6e0;
    }

    .btn-answer.correct {
      background: #2ed573 !important;
      border-color: #26af5f !important;
      color: white !important;
      box-shadow: 0 4px 0 #26af5f !important;
    }

    .btn-answer.wrong {
      background: #ff4757 !important;
      border-color: #2f3542 !important;
      color: white !important;
    }

    /* Анимация успеха */
    .pulse {
      animation: pulse-anim 0.4s ease;
    }

    @keyframes pulse-anim {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <div style="font-size: 1.1rem; font-weight: bold; color: #333;">🤟 Žest Oýuny</div>
    <div class="stars-count">⭐ <span id="stars">0</span></div>
  </div>

  <div class="mode-select">
    <button class="btn-mode active" id="modeDaktil" onclick="setMode('daktil')">🔤 Daktil (Haryplar)</button>
    <button class="btn-mode" id="modeGestures" onclick="setMode('gestures')">🖐️ Žestler (Sözler)</button>
  </div>

  <div class="game-card" id="gameCard">
    <div class="task-title" id="taskTitle">Bu haýsy haryp? (Какая это буква?)</div>
    
    <div class="gesture-box">
      <img id="questionImage" src="" alt="Žest">
    </div>

    <div class="answers-grid" id="answersGrid">
      <!-- Кнопки ответов создаются автоматически -->
    </div>
  </div>

  <script>
    // 1. Данные для дактильного алфавита (Буквы)
    const daktilData = [
      { letter: 'A', img: 'https://img.icons8.com/color/192/letter-a.png' },
      { letter: 'B', img: 'https://img.icons8.com/color/192/letter-b.png' },
      { letter: 'Ç', img: 'https://img.icons8.com/color/192/letter-c.png' },
      { letter: 'D', img: 'https://img.icons8.com/color/192/letter-d.png' },
      { letter: 'E', img: 'https://img.icons8.com/color/192/letter-e.png' }
    ];

    // 2. Данные для жестов (Слова и действия)
    const gesturesData = [
      { word: 'Okamak / Читать', img: 'https://cdn-icons-png.flaticon.com/512/2232/2232688.png' },
      { word: 'Ýazmak / Писать', img: 'https://cdn-icons-png.flaticon.com/512/1150/1150592.png' },
      { word: 'Surat çekmek / Рисовать', img: 'https://cdn-icons-png.flaticon.com/512/2970/2970785.png' },
      { word: 'Gün / День', img: 'https://cdn-icons-png.flaticon.com/512/869/869869.png' },
      { word: 'Gije / Ночь', img: 'https://cdn-icons-png.flaticon.com/512/3222/3222672.png' }
    ];

    let currentMode = 'daktil';
    let currentQuestion = null;
    let stars = 0;

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('modeDaktil').classList.toggle('active', mode === 'daktil');
      document.getElementById('modeGestures').classList.toggle('active', mode === 'gestures');
      
      document.getElementById('taskTitle').innerText = mode === 'daktil' 
        ? 'Bu haýsy haryp? (Какая это буква?)' 
        : 'Bu haýsy žest? (Какой это жест?)';

      nextQuestion();
    }

    function getRandomItems(array, count) {
      return [...array].sort(() => Math.random() - 0.5).slice(0, count);
    }

    function nextQuestion() {
      const dataSet = currentMode === 'daktil' ? daktilData : gesturesData;
      const key = currentMode === 'daktil' ? 'letter' : 'word';

      // Выбираем случайный правильный ответ
      currentQuestion = dataSet[Math.floor(Math.random() * dataSet.length)];
      document.getElementById('questionImage').src = currentQuestion.img;

      // Формируем 4 варианта ответов
      let options = [currentQuestion];
      while (options.length < Math.min(4, dataSet.length)) {
        let randomItem = dataSet[Math.floor(Math.random() * dataSet.length)];
        if (!options.includes(randomItem)) {
          options.push(randomItem);
        }
      }
      options.sort(() => Math.random() - 0.5);

      // Отрисовка кнопок
      const grid = document.getElementById('answersGrid');
      grid.innerHTML = '';

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'btn-answer';
        btn.innerText = opt[key];
        btn.onclick = () => checkAnswer(btn, opt === currentQuestion);
        grid.appendChild(btn);
      });
    }

    function checkAnswer(btn, isCorrect) {
      if (isCorrect) {
        btn.classList.add('correct');
        stars += 10;
        document.getElementById('stars').innerText = stars;
        document.getElementById('gameCard').classList.add('pulse');

        setTimeout(() => {
          document.getElementById('gameCard').classList.remove('pulse');
          nextQuestion();
        }, 600);
      } else {
        btn.classList.add('wrong');
        setTimeout(() => btn.classList.remove('wrong'), 500);
      }
    }

    // Запуск игры
    nextQuestion();
  </script>
</body>
</html>
